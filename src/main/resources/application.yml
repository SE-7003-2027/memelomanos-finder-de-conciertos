spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finder_conciertos}
    username: ${DB_USER:usuario}
    password: ${DB_PASSWORD:password}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:clave_secreta_por_defecto_para_desarrollo_local_de_al_menos_256_bits_memelomanos_finder_conciertos}
  expiration-ms: 86400000 # 24 horas

springdoc:
  swagger-ui:
    # Apunta al contrato escrito a mano (src/main/resources/static/openapi.yml),
    # que Spring sirve como archivo estatico en /openapi.yml.
    url: /openapi.yml
