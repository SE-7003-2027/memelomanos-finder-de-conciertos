spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finder_conciertos}
    username: ${DB_USER:usuario}
    password: ${DB_PASSWORD:password}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:clave_secreta_por_defecto_para_desarrollo_local_de_al_menos_256_bits_memelomanos_finder_conciertos}
  expiration-ms: 86400000 # 24 horas

# Integracion con SoundCloud (ADR-005). Sin client id ni secret solo se
# usa el Plan B (oEmbed con la soundcloudUrl guardada en los conciertos).
# Las credenciales nunca se escriben aqui: van en variables de entorno.
soundcloud:
  client-id: ${SOUNDCLOUD_CLIENT_ID:}
  client-secret: ${SOUNDCLOUD_CLIENT_SECRET:}
  api-url: https://api.soundcloud.com
  auth-url: https://secure.soundcloud.com
  oembed-url: https://soundcloud.com/oembed
  max-pistas: 5
  duracion-cache: 24h
  timeout: 5s

# Configuracion de proveedores externos (ADR-006).
# Ninguna API key ni secreto se escribe aqui: todo se lee de variables de entorno.
proveedores:
  ticketmaster:
    habilitado: ${TICKETMASTER_HABILITADO:true}
    api-key: ${TICKETMASTER_API_KEY:}
  superboletos:
    habilitado: ${SUPERBOLETOS_HABILITADO:false}
    api-key: ${SUPERBOLETOS_API_KEY:}
  viagogo:
    habilitado: ${VIAGOGO_HABILITADO:false}
    api-key: ${VIAGOGO_API_KEY:}
  soundcloud:
    habilitado: ${SOUNDCLOUD_HABILITADO:true}
    client-id: ${SOUNDCLOUD_CLIENT_ID:}
    client-secret: ${SOUNDCLOUD_CLIENT_SECRET:}

sincronizacion:
  ticketmaster:
    cron: "${TICKETMASTER_SINCRONIZACION_CRON:0 0 */6 * * *}"

springdoc:
  swagger-ui:
    # Apunta al contrato escrito a mano (src/main/resources/static/openapi.yml),
    # que Spring sirve como archivo estatico en /openapi.yml.
    url: /openapi.yml

---
spring:
  config:
    activate:
      on-profile: test

sincronizacion:
  ticketmaster:
    cron: "-"
