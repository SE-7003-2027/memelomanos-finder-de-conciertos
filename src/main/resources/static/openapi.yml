openapi: 3.0.3
info:
  title: Finder de Conciertos API
  version: 1.0.0
  description: API para la aplicación Finder de Conciertos - Team 8 (memelomanos).
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de desarrollo local

paths:
  # Conciertos
  /conciertos:
    get:
      summary: Buscar conciertos
      description: >
        Obtiene la lista global de conciertos disponibles.
        Permite filtrar por artista y ciudad.
        Busca coincidencias parciales e ignora mayusculas.
        Si se envian ambos filtros, se aplican los dos.
      tags:
        - Conciertos
      parameters:
        - name: artista
          in: query
          description: Nombre del artista para filtrar los resultados
          required: false
          schema:
            type: string
        - name: ciudad
          in: query
          description: Ciudad para filtrar los resultados
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de conciertos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concierto'

    post:
      summary: Crear un concierto
      tags:
        - Conciertos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConciertoRequest'
      responses:
        '201':
          description: Concierto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concierto'
        '400':
          $ref: '#/components/responses/PeticionInvalida'

  /conciertos/{id}:
    parameters:
      - name: id
        in: path
        description: ID del concierto que se desea consultar, actualizar o eliminar
        required: true
        schema:
          type: integer
          format: int64

    get:
      summary: Consultar un concierto por ID
      tags:
        - Conciertos
      responses:
        '200':
          description: Concierto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concierto'
        '404':
          $ref: '#/components/responses/NoEncontrado'

    put:
      summary: Actualizar un concierto por ID
      description: Reemplaza todos los datos editables del concierto.
      tags:
        - Conciertos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConciertoRequest'
      responses:
        '200':
          description: Concierto actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Concierto'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'

    delete:
      summary: Eliminar un concierto por ID
      description: >
        Quita el concierto de los favoritos de todos los usuarios
        que lo tengan guardado y luego lo elimina.
        Las dos operaciones se realizan en una misma transaccion.
      tags:
        - Conciertos
      responses:
        '204':
          description: Concierto eliminado exitosamente. Sin contenido.
        '404':
          $ref: '#/components/responses/NoEncontrado'

  # Usuarios
  /usuarios/registro:
    post:
      summary: Registrar un nuevo usuario
      description: Crea un nuevo perfil de usuario en la base de datos.
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - correo
              properties:
                nombre:
                  type: string
                correo:
                  type: string
                  format: email
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '409':
          description: El correo ya esta registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /usuarios/perfil:
    get:
      summary: Obtener perfil del usuario
      description: Devuelve los datos de un usuario a partir de su correo.
      tags:
        - Usuarios
      parameters:
        - name: correo
          in: query
          description: Correo del usuario a consultar
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /usuarios/favoritos:
    post:
      summary: Marcar un concierto como favorito
      description: >
        Añade un concierto a la lista de favoritos de un usuario.
        Version temporal sin autenticacion: recibe usuarioId
        explicitamente en el body. Cuando se implemente login, este
        endpoint debera cambiar a /usuarios/me/favoritos identificando
        al usuario por su token.
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuarioId
                - conciertoId
              properties:
                usuarioId:
                  type: integer
                  format: int64
                conciertoId:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Concierto agregado a favoritos exitosamente (o ya estaba)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  # Endpoints con autenticacion (Bearer token)
  /usuarios/me/favoritos:
    post:
      summary: Agregar un concierto a favoritos
      description: Añade un concierto a la lista de favoritos del usuario utilizando el método agregarFavorito() de la entidad.
      security:
        - bearerAuth: []
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conciertoId:
                  type: integer
                  format: int64
                  description: ID del concierto a agregar
      responses:
        '200':
          description: Concierto agregado a favoritos exitosamente
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: Concierto no encontrado

  /usuarios/me/favoritos/{conciertoId}:
    delete:
      summary: Eliminar un concierto de favoritos
      description: Remueve un concierto de la lista de favoritos del usuario autenticado.
      security:
        - bearerAuth: []
      tags:
        - Usuarios
      parameters:
        - name: conciertoId
          in: path
          required: true
          description: ID del concierto a eliminar
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Concierto eliminado de favoritos exitosamente (Sin contenido)
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: Concierto no encontrado en la lista del usuario

  /usuarios/me/artistas-top:
    get:
      summary: Obtener artistas más escuchados
      description: Devuelve la lista de los artistas más escuchados por el usuario.
      security:
        - bearerAuth: []
      tags:
        - Usuarios
      parameters:
        - name: limit
          in: query
          description: Cantidad máxima de artistas a devolver (ej. Top 10, Top 50)
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista de artistas top obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artista'
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /usuarios/me/conciertos-recomendados:
    get:
      summary: Obtener conciertos recomendados
      description: Devuelve una lista de próximos conciertos basándose en los artistas más escuchados por el usuario.
      security:
        - bearerAuth: []
      tags:
        - Usuarios
        - Conciertos
      parameters:
        - name: ciudad
          in: query
          description: Filtrar recomendaciones por ciudad
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de conciertos recomendados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concierto'
        '401':
          $ref: '#/components/responses/NoAutorizado'

# Componentes reutilizables
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    NoAutorizado:
      description: No autorizado. El usuario no ha iniciado sesión, no envió el token, o el token expiró.
    PeticionInvalida:
      description: Faltan datos, tienen un formato invalido o el JSON esta mal formado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            error: Bad Request
            mensaje: "correo: debe ser una dirección de correo electrónico con formato correcto"
            timestamp: "2026-10-01T12:00:00"
    NoEncontrado:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            error: Not Found
            mensaje: Usuario no encontrado
            timestamp: "2026-10-01T12:00:00"

  schemas:
    Error:
      type: object
      description: Forma comun de todas las respuestas de error de la API.
      properties:
        status:
          type: integer
          description: Codigo HTTP (se repite en el body para comodidad del cliente)
        error:
          type: string
          description: Nombre del codigo HTTP (ej. Not Found)
        mensaje:
          type: string
          description: Explicacion legible del error
        timestamp:
          type: string
          format: date-time

    Concierto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID autogenerado del concierto
        artista:
          type: string
          description: Nombre del artista o banda
        fecha:
          type: string
          format: date
          description: Fecha del evento en formato YYYY-MM-DD
        ciudad:
          type: string
          description: Ciudad donde se realizará el concierto
        lugar:
          type: string
          description: Recinto o lugar del evento
    
    ConciertoRequest:
      type: object
      description: Datos necesarios para crear o actualizar un concierto
      additionalProperties: false
      required:
        - artista
        - fecha
        - ciudad
        - lugar
      properties:
        artista:
          type: string
          description: Nombre del artista o banda
          minLength: 1
          pattern: '\S'
        fecha:
          type: string
          format: date
          description: Fecha del evento en formato YYYY-MM-DD
        ciudad:
          type: string
          description: Ciudad donde se realizará el concierto
          minLength: 1
          pattern: '\S'
        lugar:
          type: string
          description: Recinto o lugar del evento
          minLength: 1
          pattern: '\S'
      example:
        artista: Queen
        fecha: '2027-02-20'
        ciudad: CDMX
        lugar: Auditorio Nacional

    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID autogenerado del usuario
        nombre:
          type: string
          description: Nombre completo del usuario
        correo:
          type: string
          description: Correo electrónico del usuario
        favoritos:
          type: array
          description: Lista de conciertos que el usuario ha marcado como favoritos
          items:
            $ref: '#/components/schemas/Concierto'

    Artista:
      type: object
      properties:
        nombre:
          type: string
          description: Nombre del artista o banda
        urlImagen:
          type: string
          format: uri
          description: URL de la foto de perfil del artista
        generos:
          type: array
          description: Lista de géneros musicales asociados al artista
          items:
            type: string